<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafios Javascript</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Desafios Javascript</h1>
    </header>
    <main class="content">
        <section class="block">
            <div>
                <h3>Primer Ejercicio: Comparador de Resultados</h3>
                <button onclick="comparadorResultados()"> Probar mi Suma</button>
                <script src="./main.js"></script>
            </div>
            <div>
                <h3>Segundo Ejercicio: Quiero un número positivo</h3>
                <button onclick="solicitarNumeroPositivo()"> ¿Número Positivo o Negativo?</button>
                <script src="./main.js"></script>
            </div>
        </section>
        <section class="block">
            <div>
                <h3>Tercer Ejercicio: Sumatoria de valores</h3>
                <button onclick="promedioSumatoria()">Sumatoria</button>
                <script src="./main.js"></script>
            </div>
            <div>
                <h3>Cuarto Ejercicio: ¿Es verdadero o falso?</h3>
                <button onclick="validarNumeroPositivoEntero()">NumeroEntero?? True o False??</button>
                <script src="./main.js"></script>
            </div>  
        </section>
    </main>
    <footer>
        <video class="osito" src="./media/OsitoDev.mp4" autoplay loop muted playsinline></video>
    </footer>
</body>
</html>
